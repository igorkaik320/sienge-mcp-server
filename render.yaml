services:
  - type: web
    name: sienge-mcp-server
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SIENGE_SUBDOMAIN
        sync: false
      - key: SIENGE_USERNAME
        sync: false
      - key: SIENGE_PASSWORD
        sync: false
      - key: MCP_API_KEY
        sync: false
      - key: READ_ONLY
        sync: false
        value: "false"
